name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test
  extension-version:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 scripts/check_extension_version.py origin/${{ github.base_ref }}
  python:
    # Linux runs everything but the Vision/AppKit paths; macOS runs the whole suite.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install google-genai pytest
      - if: runner.os == 'macOS'
        run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
